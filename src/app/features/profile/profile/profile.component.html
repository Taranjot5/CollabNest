<div class="profile-page">

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading profile...</p>
  </div>

  <div class="profile-card" *ngIf="!loading">

    <div class="profile-header">
      <div class="avatar">{{ name?.charAt(0)?.toUpperCase() || '?' }}</div>
      <div>
        <h1>{{ name || 'My Profile' }}</h1>
        <p>{{ email }}</p>
      </div>
    </div>

    <!-- VIEW MODE -->

    <div *ngIf="!isEditing" class="profile-details">

      <div class="detail-item">
        <label>Name</label>
        <span>{{ name }}</span>
      </div>

      <div class="detail-item">
        <label>Email</label>
        <span>{{ email }}</span>
      </div>

      <div class="detail-item">
        <label>Bio</label>
        <span>{{ bio || 'Not added yet' }}</span>
      </div>

      <div class="detail-item">
        <label>Department</label>
        <span>{{ department || 'Not added yet' }}</span>
      </div>

      <div class="detail-item">
        <label>Designation</label>
        <span>{{ designation || 'Not added yet' }}</span>
      </div>

      <button class="edit-btn" (click)="editProfile()">
        <mat-icon>edit</mat-icon>
        Edit Profile
      </button>

    </div>

    <!-- EDIT MODE -->

    <div class="profile-form" *ngIf="isEditing">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [value]="email" readonly>
      </div>

      <div class="form-group">
        <label>Bio</label>
        <textarea rows="4" [(ngModel)]="bio"></textarea>
      </div>

      <div class="form-group">
        <label>Department</label>
        <input type="text" [(ngModel)]="department">
      </div>

      <div class="form-group">
        <label>Designation</label>
        <input type="text" [(ngModel)]="designation">
      </div>

      <div class="action-buttons">
        <button class="save-btn" (click)="saveProfile()" [disabled]="saving">
          {{ saving ? 'Saving...' : 'Save Changes' }}
        </button>
        <button class="cancel-btn" (click)="cancelEdit()">Cancel</button>
      </div>

    </div>

  </div>

</div>
