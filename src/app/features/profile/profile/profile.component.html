<div class="profile-page">

  <div
    class="profile-card"
    *ngIf="!loading">


<div class="profile-header">

  <h1>My Profile</h1>

  <p>Manage your account information</p>

</div>

<!-- VIEW MODE -->

<div *ngIf="!isEditing">

  <div class="profile-details">

    <div class="detail-item">

      <label>Name</label>

      <span>{{ name }}</span>

    </div>

    <div class="detail-item">

      <label>Email</label>

      <span>{{ email }}</span>

    </div>

    <div class="detail-item">

      <label>Bio</label>

      <span>{{ bio || 'Not Added' }}</span>

    </div>

    <div class="detail-item">

      <label>Department</label>

      <span>{{ department || 'Not Added' }}</span>

    </div>

    <div class="detail-item">

      <label>Designation</label>

      <span>{{ designation || 'Not Added' }}</span>

    </div>

  </div>

  <button
    class="edit-btn"
    (click)="editProfile()">

    Edit Profile

  </button>

</div>

<!-- EDIT MODE -->

<div
  class="profile-form"
  *ngIf="isEditing">

  <div class="form-group">

    <label>Full Name</label>

    <input
      type="text"
      [(ngModel)]="name">

  </div>

  <div class="form-group">

    <label>Email</label>

    <input
      type="email"
      [value]="email"
      readonly>

  </div>

  <div class="form-group">

    <label>Bio</label>

    <textarea
      rows="4"
      [(ngModel)]="bio">

    </textarea>

  </div>

  <div class="form-group">

    <label>Department</label>

    <input
      type="text"
      [(ngModel)]="department">

  </div>

  <div class="form-group">

    <label>Designation</label>

    <input
      type="text"
      [(ngModel)]="designation">

  </div>

  <div class="action-buttons">

    <button
      class="save-btn"
      (click)="saveProfile()">

      Save Changes

    </button>

    <button
      class="cancel-btn"
      (click)="cancelEdit()">

      Cancel

    </button>

  </div>

</div>


  </div>

</div>
