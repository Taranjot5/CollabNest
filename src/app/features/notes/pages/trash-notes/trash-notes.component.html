<h1 class="page-title">
  Trash Notes
</h1>

<div
  class="empty-state"
  *ngIf="trashedNotes.length === 0">

  No notes in trash

</div>

<div class="notes-container">

  <div
    class="note-card"
    *ngFor="let note of trashedNotes">

    <div class="top-row">

      <span class="category">
        {{ note.category }}
      </span>

      <span class="priority">
        {{ note.priority }}
      </span>

    </div>

    <h3>
      {{ note.title }}
    </h3>

    <div
      class="note-preview"
      [innerHTML]="note.content">

    </div>

    <div class="actions">

      <button
        class="restore-btn"
        (click)="restoreNote(note.id)">

        Restore

      </button>

      <button
        class="delete-btn"
        (click)="deleteForever(note.id)">

        Delete Forever

      </button>

    </div>

  </div>

</div>
