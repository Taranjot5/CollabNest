<div class="collection-page">

  <div class="page-header">
    <h1>Shared Notes</h1>
    <p>Notes shared with you by collaborators.</p>
  </div>

  <div class="notes-grid" *ngIf="sharedNotes.length > 0">

    <div
      class="note-card"
      *ngFor="let note of sharedNotes"
      (click)="openNote(note.id)">

      <div class="note-top">
        <span class="category">{{ note.category }}</span>
        <span class="priority" [ngClass]="note.priority?.toLowerCase()">{{ note.priority }}</span>
      </div>

      <h3>{{ note.title || 'Untitled' }}</h3>

      <div class="note-preview" [innerHTML]="note.content"></div>

      <div class="shared-badge">
        <mat-icon>groups</mat-icon>
        Shared with you
      </div>

      <div class="note-footer">
        Updated {{ note.updatedAt | date:'medium' }}
      </div>

    </div>

  </div>

  <div class="empty-state" *ngIf="sharedNotes.length === 0">
    <mat-icon class="empty-icon">groups</mat-icon>
    <h3>No shared notes</h3>
    <p>When someone shares a note with you, it will appear here.</p>
  </div>

</div>
