<div class="register-page">

  <!-- LEFT SIDE -->

  <div class="register-left">

    <div class="overlay"></div>

    <div class="branding">

      <h1>
        Knowledge Hub
      </h1>

      <p>
        Organize notes, collaborate with teams,
        and manage your knowledge smarter.
      </p>

      <div class="features">

        <div class="feature">


          <p>Smart Note Management</p>

        </div>

        <div class="feature">


          <p>Star Important Notes</p>

        </div>

        <div class="feature">


          <p>Share & Collaborate</p>

        </div>

      </div>

    </div>

  </div>

  <!-- RIGHT SIDE -->

  <div class="register-right">

    <div class="register-card">

      <h2>
        Create Account
      </h2>

      <p class="subtitle">
        Start your productivity journey
      </p>

      <!-- NAME -->

      <div class="input-group">

        <label>
          Full Name
        </label>

        <input
          type="text"
          placeholder="Enter your full name"
          [(ngModel)]="name">

      </div>

      <!-- EMAIL -->

      <div class="input-group">

        <label>
          Email Address
        </label>

        <input
          type="email"
          placeholder="Enter your email"
          [(ngModel)]="email">

      </div>

      <!-- PASSWORD -->

      <div class="input-group">

        <label>
          Password
        </label>

        <input
          type="password"
          placeholder="Enter your password"
          [(ngModel)]="password">

      </div>

      <!-- REGISTER BUTTON -->

      <button
        class="register-btn"
        (click)="register()"
        [disabled]="loading">

        {{
          loading
          ? 'Creating Account...'
          : 'Create Account'
        }}

      </button>

      <!-- ERROR -->

      <p
        class="error"
        *ngIf="errorMessage">

        {{ errorMessage }}

      </p>

      <!-- LOGIN LINK -->

      <p class="login-link">

        Already have an account?

        <a routerLink="/auth/login">

          Login

        </a>

      </p>

    </div>

  </div>

</div>
