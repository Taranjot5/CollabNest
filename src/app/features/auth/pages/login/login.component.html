<div class="auth-container">

  <mat-card>

    <h2>Login</h2>

    <form [formGroup]="loginForm">

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          formControlName="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          formControlName="password">
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        (click)="onLogin()">

        Login
      </button>

      <button
        mat-stroked-button
        type="button"
        (click)="loginWithGoogle()">

        Login with Google
      </button>

    </form>

    <p class="error">
      {{ errorMessage }}
    </p>

  </mat-card>

</div>
