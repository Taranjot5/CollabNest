<div class="user-form-page">

  <div class="page-header">
    <div>
      <h1>{{ isEdit ? 'Edit User' : 'Add New User' }}</h1>
      <p>{{ isEdit ? 'Update user details, role, and workspace access.' : 'Create a new user account with role-based permissions.' }}</p>
    </div>
  </div>

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading user...</p>
  </div>

  <div class="card-panel" *ngIf="!loading">

    <div class="form-grid">

      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" [(ngModel)]="name" placeholder="Enter full name">
      </div>

      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" [(ngModel)]="email" placeholder="user@example.com" [readonly]="isEdit">
      </div>

      <div class="form-group" *ngIf="!isEdit">
        <label>Password *</label>
        <input type="password" [(ngModel)]="password" placeholder="Temporary password">
      </div>

      <div class="form-group">
        <label>Role *</label>
        <select [(ngModel)]="role">
          <option *ngFor="let opt of roleOptions" [value]="opt.value">{{ opt.label }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Department</label>
        <input type="text" [(ngModel)]="department" placeholder="e.g. Engineering">
      </div>

      <div class="form-group">
        <label>Designation</label>
        <input type="text" [(ngModel)]="designation" placeholder="e.g. Software Engineer">
      </div>

      <div class="form-group" *ngIf="isEdit">
        <label>Status</label>
        <select [(ngModel)]="status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>

    </div>

    <div class="workspace-section">
      <label>Workspace Access</label>
      <p class="hint">Select workspaces this user can access.</p>

      <div class="workspace-chips" *ngIf="workspaces.length > 0">
        <button
          type="button"
          class="workspace-chip"
          *ngFor="let ws of workspaces"
          [class.selected]="isWorkspaceSelected(ws.id!)"
          (click)="toggleWorkspace(ws.id!)">
          <mat-icon>{{ isWorkspaceSelected(ws.id!) ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
          {{ ws.name }}
        </button>
      </div>

      <p class="empty-hint" *ngIf="workspaces.length === 0">
        No workspaces available. Create workspaces first.
      </p>
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="action-buttons">
      <button class="primary-btn" (click)="save()" [disabled]="saving">
        {{ saving ? 'Saving...' : (isEdit ? 'Update User' : 'Create User') }}
      </button>
      <button class="cancel-btn" (click)="cancel()">Cancel</button>
    </div>

  </div>

</div>
